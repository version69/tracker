name: Good First Issue Tracker

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: good-first-issue-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search issues and send email
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEARCH_LABELS: ${{ vars.SEARCH_LABELS }}
          TRACK_REPOS: ${{ vars.TRACK_REPOS }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          MAX_ISSUES_PER_EMAIL: ${{ vars.MAX_ISSUES_PER_EMAIL }}
        run: python scripts/track_issues.py

      - name: Commit seen issues
        run: |
          if git diff --quiet seen.json; then
            echo "No new issues to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen good-first issues"
            git push
          fi
